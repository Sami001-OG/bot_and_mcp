name: CI
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read, packages: write, id-token: write }
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres: { image: postgres:17-alpine, env: { POSTGRES_USER: trading, POSTGRES_PASSWORD: trading, POSTGRES_DB: trading }, ports: ["5432:5432"], options: "--health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10" }
      redis: { image: redis:7.4-alpine, ports: ["6379:6379"] }
    env: { DATABASE_URL: "postgresql://trading:trading@localhost:5432/trading?schema=public", REDIS_URL: "redis://localhost:6379" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.18.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.22.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Materialize root .env (Prisma validate/generate read env from the file)
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          echo "REDIS_URL=$REDIS_URL" >> .env
      - run: pnpm db:generate
      - run: pnpm quality
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, severity: "CRITICAL,HIGH", exit-code: "1" }
  image:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Lowercase image tag (GHCR requires lowercase repository names)
        id: img
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/Dockerfile, push: true, tags: "${{ steps.img.outputs.image }}" }
