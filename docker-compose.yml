services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: trading, POSTGRES_PASSWORD: trading, POSTGRES_DB: trading }
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U trading"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]
volumes: { postgres-data: {}, redis-data: {} }
