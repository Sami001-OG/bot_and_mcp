services:
  - type: web
    name: trading-api-staging
    autoDeployTrigger: checksPass
    region: oregon
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile
    dockerCommand: sh infra/docker/start.sh node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: trading-postgres-staging, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: trading-redis-staging, property: connectionString }
      - key: CORS_ORIGINS
        value: https://trading-web-staging.onrender.com,http://localhost:3000,http://localhost:3001
      - key: RUN_MIGRATIONS
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SMTP_URL
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
  - type: worker
    name: trading-worker-staging
    autoDeployTrigger: checksPass
    region: oregon
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile
    dockerCommand: sh infra/docker/start.sh node apps/worker/dist/main.js
    maxShutdownDelaySeconds: 120
    envVars:
      - key: DATABASE_URL
        fromDatabase: { provider: postgres, name: trading-postgres-staging, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: trading-redis-staging, property: connectionString }
      - key: RUN_MIGRATIONS
        value: "true"
      - key: ENCRYPTION_KEY
        fromService: { type: web, name: trading-api-staging, envVarKey: ENCRYPTION_KEY }
      - key: SMTP_URL
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
  - type: web
    name: trading-mcp-staging
    autoDeployTrigger: checksPass
    region: oregon
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile
    dockerCommand: sh infra/docker/start.sh node apps/mcp-server/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { provider: postgres, name: trading-postgres-staging, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: trading-redis-staging, property: connectionString }
      - key: RUN_MIGRATIONS
        value: "true"
      - key: ENCRYPTION_KEY
        fromService: { type: web, name: trading-api-staging, envVarKey: ENCRYPTION_KEY }
      - key: JWT_ACCESS_SECRET
        fromService: { type: web, name: trading-api-staging, envVarKey: JWT_ACCESS_SECRET }
  - type: web
    name: trading-web-staging
    autoDeployTrigger: checksPass
    region: oregon
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile
    dockerCommand: sh infra/docker/start.sh web
    healthCheckPath: /bots
  - type: keyvalue
    name: trading-redis-staging
    region: oregon
    plan: standard
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []
databases:
  - name: trading-postgres-staging
    region: oregon
    plan: basic-1gb
    databaseName: trading
    user: trading