apiVersion: v1
kind: Namespace
metadata: { name: trading-platform }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: trading-platform }
spec:
  replicas: 3
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/example/trading-platform:latest
          command: ["node", "apps/api/dist/main.js"]
          ports: [{ containerPort: 4000 }]
          readinessProbe: { httpGet: { path: /api/v1/health, port: 4000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/v1/health, port: 4000 }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: trading-platform }
spec: { selector: { app: api }, ports: [{ port: 80, targetPort: 4000 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: trading-platform }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api, namespace: trading-platform }
spec: { minAvailable: 2, selector: { matchLabels: { app: api } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: trading-platform }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
